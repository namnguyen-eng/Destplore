<!doctype html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Keyword Grid Tool</title>

<link rel="stylesheet"
href="styles.css">

</head>

<body>

<div class="card">

<h2>INPUT</h2>

<label>Keyword:</label>

<input
id="keyword"
value="TOGETHER">

<label>List of words:</label>

<textarea id="words">

ATLANTA
HOME
GOD
RESIDENTS
TRAVAIL
WEALTH
SWEET
AUBURN

</textarea>

<button id="generate">

Generate

</button>

<p id="error"></p>

</div>


<div class="outputs">

<section>

<h3>Empty</h3>

<div id="empty"></div>

</section>


<section>

<h3>Sparse</h3>

<div id="sparse"></div>

</section>


<section>

<h3>Full</h3>

<div id="full"></div>

</section>

</div>


<script src="script.js"></script>

</body>
</html>
